name: Build installer

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Тесты (на настоящей Windows)
        run: python -m unittest discover tests

      - name: Сборка exe (PyInstaller)
        run: |
          pip install pyinstaller dxcam pillow numpy opencv-python-headless PyAudioWPatch
          pyinstaller --noconfirm --clean --onedir --noconsole --name PCControl --icon installer/icon.ico --add-data "installer/icon.ico;." --hidden-import tkinter --collect-all dxcam --collect-submodules comtypes --hidden-import cv2 --collect-all cv2 --hidden-import pyaudiowpatch --collect-all pyaudiowpatch server.py

      - name: "Проверка собранного сервера (запуск, ping и трансляция экрана)"
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PCControl\PCControl.exe" -ArgumentList "--minimized" -PassThru
          Start-Sleep -Seconds 10
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765/ping" -UseBasicParsing -TimeoutSec 10
          Write-Host "ping -> $($r.StatusCode)"
          if ($r.StatusCode -ne 200) { exit 1 }
          python tools/stream_smoke.py
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          if (Test-Path "$env:LOCALAPPDATA\PCControl\server.log") { Get-Content "$env:LOCALAPPDATA\PCControl\server.log" -Tail 15 }
          if ($code -ne 0) { exit $code }

      - name: Версия
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path server\version.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\PCControl.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PCControl-Setup
          path: dist-installer/PCControl-Setup.exe

      - name: Релиз на GitHub (если такой версии ещё нет)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Релиз $tag уже есть — поднимите VERSION в server/version.py для нового"
            exit 0
          }
          gh release create $tag dist-installer/PCControl-Setup.exe --title "Пульт ПК Хост $tag" --notes "Установщик для Windows. Скачайте PCControl-Setup.exe и запустите."
